<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日文單字發音庫</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f7f8fc;color:#1e293b;margin:0;padding:18px;max-width:720px;margin:auto}h1{font-size:25px}p{color:#64748b}input,select,button{font:inherit;border:1px solid #cbd5e1;border-radius:10px;padding:11px;background:white}input{min-width:0}button{cursor:pointer}button.primary{background:#2563eb;color:white;border:0}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.bar input{flex:1}.item{background:white;border:1px solid #e2e8f0;border-radius:15px;padding:15px;margin:10px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}.word{font-size:23px;font-weight:700}.read{color:#475569}.meaning{margin-top:5px}.category{font-size:12px;color:#64748b}.play{font-size:22px}details{background:white;padding:14px;border-radius:12px;margin:16px 0}details input{margin:4px 0;width:90%;box-sizing:border-box}#count{font-size:13px}</style></head><body><h1>🇯🇵 日文單字發音庫</h1><p>第1、2課與補充單字 · 點 🔊 聽日語發音</p><div class="bar"><input id="search" placeholder="搜尋日文、假名或中文"><select id="filter"><option value="">全部分類</option></select></div><div class="bar"><button class="primary" id="playAll">▶ 連續朗讀</button><button id="stopAll">■ 停止</button><label style="display:flex;align-items:center;gap:4px"><input id="repeat" type="checkbox">循環播放</label><select id="speed"><option value="0.7">慢速</option><option value="0.82" selected>一般</option><option value="1">快速</option></select><label style="display:flex;align-items:center;gap:4px">間隔<select id="pause"><option value="800">短</option><option value="1500" selected>中（1.5秒）</option><option value="2500">長（2.5秒）</option></select></label></div><div id="status" aria-live="polite" style="font-size:13px;color:#475569"></div><div id="count"></div><div id="list"></div><details><summary>＋ 新增單字</summary><input id="w" placeholder="日文"><input id="r" placeholder="假名"><input id="m" placeholder="中文"><button class="primary" id="add">加入單字</button></details><div class="bar"><button id="export">匯出 JSON 備份</button><button id="import">匯入 JSON</button><input type="file" id="file" accept=".json,application/json" hidden></div><p>單字修改儲存在目前瀏覽器。更換手機或清除瀏覽資料前，請先匯出備份。發音由手機系統提供。</p><script>const seed=[{"w":"何の","r":"なんの","m":"什麼類別的","c":"11/19"},{"w":"誰の","r":"だれの","m":"誰的","c":"11/19"},{"w":"どこの","r":"どこの","m":"哪裡的、哪家公司的","c":"11/19"},{"w":"誰","r":"だれ","m":"誰","c":"11/19"},{"w":"どなた","r":"どなた","m":"哪一位（禮貌）","c":"11/19"},{"w":"どちら","r":"どちら","m":"哪邊、哪一位","c":"11/19"},{"w":"こちら","r":"こちら","m":"這邊、這位","c":"11/19"},{"w":"そちら","r":"そちら","m":"那邊（靠近對方）","c":"11/19"},{"w":"あちら","r":"あちら","m":"遠處那邊","c":"11/19"},{"w":"そうです","r":"そうです","m":"是的、沒錯","c":"11/19"},{"w":"違います","r":"ちがいます","m":"不對、不是","c":"11/19"},{"w":"そうですか","r":"そうですか","m":"原來如此","c":"11/19"},{"w":"あのう","r":"あのう","m":"那個……（搭話）","c":"11/19"},{"w":"ええ","r":"ええ","m":"是的（口語）","c":"11/19"},{"w":"どうぞ","r":"どうぞ","m":"請","c":"11/19"},{"w":"どうも","r":"どうも","m":"謝謝（簡短）","c":"11/19"},{"w":"ありがとうございます","r":"ありがとうございます","m":"非常感謝","c":"11/19"},{"w":"私","r":"わたし","m":"我","c":"第1課"},{"w":"あなた","r":"あなた","m":"你","c":"第1課"},{"w":"あの人","r":"あのひと","m":"那個人","c":"第1課"},{"w":"先生","r":"せんせい","m":"老師（稱呼）","c":"第1課"},{"w":"教師","r":"きょうし","m":"教師（職業）","c":"第1課"},{"w":"学生","r":"がくせい","m":"學生","c":"第1課"},{"w":"会社員","r":"かいしゃいん","m":"公司職員","c":"第1課"},{"w":"医者","r":"いしゃ","m":"醫師","c":"第1課"},{"w":"研究者","r":"けんきゅうしゃ","m":"研究人員","c":"第1課"},{"w":"日本","r":"にほん","m":"日本","c":"第1課"},{"w":"台湾","r":"たいわん","m":"臺灣","c":"第1課"},{"w":"日本人","r":"にほんじん","m":"日本人","c":"第1課"},{"w":"台湾人","r":"たいわんじん","m":"臺灣人","c":"第1課"},{"w":"何歳","r":"なんさい","m":"幾歲","c":"第1課"},{"w":"おいくつ","r":"おいくつ","m":"幾歲（禮貌）","c":"第1課"},{"w":"これ","r":"これ","m":"這個","c":"第2課"},{"w":"それ","r":"それ","m":"那個（靠近對方）","c":"第2課"},{"w":"あれ","r":"あれ","m":"那個（遠處）","c":"第2課"},{"w":"どれ","r":"どれ","m":"哪個","c":"第2課"},{"w":"この","r":"この","m":"這個＋名詞","c":"第2課"},{"w":"その","r":"その","m":"那個＋名詞（靠近對方）","c":"第2課"},{"w":"あの","r":"あの","m":"那個＋名詞（遠處）","c":"第2課"},{"w":"どの","r":"どの","m":"哪個＋名詞","c":"第2課"},{"w":"ここ","r":"ここ","m":"這裡","c":"第2課"},{"w":"そこ","r":"そこ","m":"那裡（靠近對方）","c":"第2課"},{"w":"あそこ","r":"あそこ","m":"那裡（遠處）","c":"第2課"},{"w":"どこ","r":"どこ","m":"哪裡","c":"第2課"},{"w":"本","r":"ほん","m":"書","c":"第2課"},{"w":"辞書","r":"じしょ","m":"字典","c":"第2課"},{"w":"雑誌","r":"ざっし","m":"雜誌","c":"第2課"},{"w":"新聞","r":"しんぶん","m":"報紙","c":"第2課"},{"w":"ノート","r":"ノート","m":"筆記本","c":"第2課"},{"w":"手帳","r":"てちょう","m":"記事本","c":"第2課"},{"w":"名刺","r":"めいし","m":"名片","c":"第2課"},{"w":"鉛筆","r":"えんぴつ","m":"鉛筆","c":"第2課"},{"w":"ボールペン","r":"ボールペン","m":"原子筆","c":"第2課"},{"w":"シャープペンシル","r":"シャープペンシル","m":"自動鉛筆","c":"第2課"},{"w":"鍵","r":"かぎ","m":"鑰匙","c":"第2課"},{"w":"時計","r":"とけい","m":"鐘錶","c":"第2課"},{"w":"傘","r":"かさ","m":"傘","c":"第2課"},{"w":"鞄","r":"かばん","m":"包包","c":"第2課"},{"w":"テレビ","r":"テレビ","m":"電視","c":"第2課"},{"w":"ラジオ","r":"ラジオ","m":"收音機","c":"第2課"},{"w":"カメラ","r":"カメラ","m":"相機","c":"第2課"},{"w":"コンピューター","r":"コンピューター","m":"電腦","c":"第2課"},{"w":"車","r":"くるま","m":"汽車","c":"第2課"},{"w":"机","r":"つくえ","m":"桌子","c":"第2課"},{"w":"椅子","r":"いす","m":"椅子","c":"第2課"},{"w":"チョコレート","r":"チョコレート","m":"巧克力","c":"第2課"},{"w":"コーヒー","r":"コーヒー","m":"咖啡","c":"第2課"},{"w":"お土産","r":"おみやげ","m":"伴手禮","c":"第2課"},{"w":"英語","r":"えいご","m":"英語","c":"第2課"},{"w":"日本語","r":"にほんご","m":"日語","c":"第2課"},{"w":"何","r":"なん","m":"什麼","c":"第2課"},{"w":"いくら","r":"いくら","m":"多少錢","c":"補充講義"},{"w":"無料","r":"むりょう","m":"免費","c":"補充講義"},{"w":"円","r":"えん","m":"日圓","c":"補充講義"},{"w":"お札","r":"おさつ","m":"紙鈔","c":"補充講義"},{"w":"硬貨","r":"こうか","m":"硬幣","c":"補充講義"},{"w":"住所","r":"じゅうしょ","m":"地址","c":"補充講義"},{"w":"電話番号","r":"でんわばんごう","m":"電話號碼","c":"補充講義"},{"w":"郵便番号","r":"ゆうびんばんごう","m":"郵遞區號","c":"補充講義"},{"w":"都","r":"と","m":"都（行政區）","c":"補充講義"},{"w":"道","r":"どう","m":"道（行政區）","c":"補充講義"},{"w":"府","r":"ふ","m":"府（行政區）","c":"補充講義"},{"w":"県","r":"けん","m":"縣（行政區）","c":"補充講義"},{"w":"市","r":"し","m":"市","c":"補充講義"},{"w":"区","r":"く","m":"區","c":"補充講義"},{"w":"町","r":"まち","m":"町","c":"補充講義"},{"w":"村","r":"むら","m":"村","c":"補充講義"},{"w":"丁目","r":"ちょうめ","m":"丁目","c":"補充講義"},{"w":"番地","r":"ばんち","m":"番地","c":"補充講義"},{"w":"号","r":"ごう","m":"號","c":"補充講義"},{"w":"分かりません","r":"わかりません","m":"不知道","c":"補充講義"},{"w":"じゃありません","r":"じゃありません","m":"不是（口語）","c":"補充講義"},{"w":"今週","r":"こんしゅう","m":"這週","c":"補充時間"},{"w":"来週","r":"らいしゅう","m":"下週","c":"補充時間"},{"w":"再来週","r":"さらいしゅう","m":"下下週","c":"補充時間"},{"w":"先週","r":"せんしゅう","m":"上週","c":"補充時間"},{"w":"また来週","r":"またらいしゅう","m":"下週見","c":"補充時間"},{"w":"さようなら","r":"さようなら","m":"再見","c":"補充時間"}];const key='jp_vocab_full_v2';let words;try{words=JSON.parse(localStorage.getItem(key))||seed}catch(e){words=seed}const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(key,JSON.stringify(words))}catch(e){alert('無法儲存，請使用匯出備份')}}let playing=false,queue=[],position=0,token=0,pendingTimer=null;
function stopAll(){playing=false;token++;if(pendingTimer!==null){clearTimeout(pendingTimer);pendingTimer=null}if('speechSynthesis'in window)speechSynthesis.cancel();$('status').textContent='已停止'}
function waitThen(ms,t,fn){if(!playing||t!==token)return;pendingTimer=setTimeout(()=>{pendingTimer=null;if(playing&&t===token)fn()},ms)}
function saySegment(text,lang,t,next){if(!playing||t!==token)return;if(!text){next();return}let u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=lang==='ja-JP'?Number($('speed').value):0.9;let done=false;const finish=()=>{if(done)return;done=true;if(playing&&t===token)next()};u.onend=finish;u.onerror=finish;window.speechSynthesis.speak(u)}
function playNext(t){if(!playing||t!==token)return;if(position>=queue.length){if($('repeat').checked)position=0;else{playing=false;$('status').textContent='朗讀完成';return}}let x=queue[position++];$('status').textContent='正在朗讀 '+position+' / '+queue.length+'：'+x.w+' → '+x.m;let pause=Number($('pause').value);saySegment(x.r||x.w,'ja-JP',t,()=>waitThen(pause,t,()=>saySegment(x.m,'zh-TW',t,()=>waitThen(pause,t,()=>playNext(t)))))}
function speak(t){stopAll();if(!('speechSynthesis'in window)){alert('瀏覽器不支援語音');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=Number($('speed').value);speechSynthesis.speak(u)}function visibleWords(){let q=$('search').value.trim().toLowerCase(),c=$('filter').value;return words.filter(x=>(!c||(x.c||'自訂')===c)&&[x.w,x.r,x.m].some(t=>String(t||'').toLowerCase().includes(q)))}$('playAll').onclick=()=>{if(!('speechSynthesis'in window)){alert('此瀏覽器不支援語音');return}stopAll();queue=visibleWords();if(!queue.length){$('status').textContent='沒有可朗讀的單字';return}position=0;playing=true;let t=token;playNext(t)};$('stopAll').onclick=stopAll;function render(){let cats=[...new Set(words.map(x=>x.c||'自訂'))];let current=$('filter').value;$('filter').replaceChildren(new Option('全部分類',''),...cats.map(c=>new Option(c,c)));$('filter').value=current;let q=$('search').value.trim().toLowerCase();let arr=visibleWords();$('count').textContent='顯示 '+arr.length+' / '+words.length+' 個單字';$('list').replaceChildren(...arr.map(x=>{let card=document.createElement('div');card.className='item';let info=document.createElement('div');let a=document.createElement('div');a.className='word';a.textContent=x.w;let b=document.createElement('div');b.className='read';b.textContent=x.r;let c=document.createElement('div');c.className='meaning';c.textContent=x.m;let d=document.createElement('div');d.className='category';d.textContent=x.c||'自訂';info.append(a,b,c,d);let btn=document.createElement('button');btn.className='play';btn.textContent='🔊';btn.setAttribute('aria-label','播放 '+x.w);btn.onclick=()=>speak(x.r||x.w);card.append(info,btn);return card}))}$('search').oninput=render;$('filter').onchange=render;$('add').onclick=()=>{let w=$('w').value.trim(),r=$('r').value.trim(),m=$('m').value.trim();if(!w||!m){alert('請填寫日文與中文');return}words.push({w,r,m,c:'自訂'});save();['w','r','m'].forEach(id=>$(id).value='');$('filter').value='';render()};$('export').onclick=()=>{let blob=new Blob([JSON.stringify(words,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='日文單字備份.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let v=JSON.parse(await f.text());if(!Array.isArray(v))throw Error();words=v.map(x=>({w:x.w||x.word||'',r:x.r||x.reading||'',m:x.m||x.meaning||'',c:x.c||x.category||'匯入'})).filter(x=>x.w);save();render();alert('匯入完成')}catch(e){alert('檔案格式不正確')}};render();</script></body></html>
